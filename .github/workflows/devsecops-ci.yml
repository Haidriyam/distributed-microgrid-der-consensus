name: Microgrid DER Consensus CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tooling and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest bandit
          pip install -r requirements.txt

      - name: Static Security Audit (Bandit SAST)
        run: |
          bandit -r microgrid/ -ll

      - name: PEP8 Code Hygiene Enforcement
        run: |
          flake8 microgrid/ tests/ --count --ignore=W292,W503 --max-line-length=120 --statistics

      - name: Execute Byzantine Consensus & Droop Test Suite
        run: |
          PYTHONPATH=. pytest tests/ -v

      - name: Build Hardened Container
        run: |
          docker build -t distributed-microgrid-der-consensus:latest .